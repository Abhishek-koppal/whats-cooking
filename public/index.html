<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasoi</title>
  <meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header class="top">
      <!-- The name is a button: tapping it goes back to the home screen (js/main.js) -->
      <h1><button type="button" id="logo" class="logo" data-i18n-aria="logo.home">Rasoi</button></h1>

      <div class="tools">
        <!-- Language picker: filled in by js/main.js from js/i18n.js -->
        <select id="lang" class="lang-select" data-i18n-aria="lang.label"></select>

        <!-- Text size slider (js/features/textSize.js) -->
        <button type="button" id="text-size" class="size-btn" aria-expanded="false" aria-controls="size-panel" data-i18n-aria="size.open">Aa</button>
        <div id="size-panel" class="size-panel" hidden>
          <p class="eyebrow" data-i18n="size.title">Text size</p>
          <div class="size-row">
            <span class="a-small" aria-hidden="true">A</span>
            <input type="range" id="size-range" min="80" max="160" step="5" value="100" data-i18n-aria="size.title">
            <span class="a-big" aria-hidden="true">A</span>
          </div>
          <div class="size-foot">
            <output id="size-value" for="size-range">100%</output>
            <button type="button" id="size-reset" class="link" data-i18n="size.reset">Normal size</button>
          </div>
        </div>
      </div>
    </header>

    <!-- The questions (filled in by js/features/onboarding.js) -->
    <section id="onboarding" hidden></section>

    <!-- The main app -->
    <div id="app" hidden>
      <!-- The feature buttons, shown on the home screen (js/features/nav.js) -->
      <nav id="nav" class="nav-grid" aria-label="Rasoi"></nav>

      <div class="prefs-bar">
        <span id="prefs-summary"></span>
        <button type="button" id="change-prefs" class="link" data-i18n="prefs.change">Change</button>
      </div>

      <!-- Today's menu (js/features/today.js) -->
      <section id="home"></section>

      <!-- Today's recipes (js/features/today.js) -->
      <section id="recipes" hidden></section>

      <!-- The weekly meal plan (js/features/mealplan.js) -->
      <section id="mealplan" hidden></section>

      <!-- The shopping list (js/features/shopping.js) -->
      <section id="shopping" hidden></section>

      <!-- A feature that is not built yet (js/features/nav.js) -->
      <section id="soon" hidden></section>

      <!-- Recipe from the ingredients you have (js/features/recipe.js) -->
      <section id="cook" hidden>
        <button type="button" id="back-home" class="link back" data-i18n="back.home">← Home</button>
        <h2 data-i18n="cook.title">Cook with what I have</h2>
        <p class="lead" data-i18n="cook.lead">Tell me what you have at home and I'll suggest a recipe.</p>

        <form id="form">
          <label for="ingredients" data-i18n="cook.ingredients">Ingredients you have</label>
          <textarea id="ingredients" rows="3" maxlength="300"
            placeholder="For example: rice, water, salt, egg" data-i18n-placeholder="cook.placeholder" required></textarea>

          <label for="servings" data-i18n="cook.servings">How many servings?</label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="One less serving" data-i18n-aria="cook.less">−</button>
            <input id="servings" type="number" value="2" min="1" max="12" inputmode="numeric" required>
            <button type="button" id="plus" aria-label="One more serving" data-i18n-aria="cook.more">+</button>
          </div>

          <label for="cuisine" data-i18n="cook.cuisine">Type of food</label>
          <select id="cuisine">
            <option value="Indian" data-i18n="cuisine.Indian">Indian</option>
            <option value="Continental" data-i18n="cuisine.Continental">Continental</option>
            <option value="Chinese" data-i18n="cuisine.Chinese">Chinese</option>
          </select>

          <button type="submit" id="go" class="primary" data-i18n="cook.go">Get recipe</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="result" hidden>
          <h2 id="recipe-name"></h2>
          <p id="recipe-meta" class="meta"></p>

          <h3 data-i18n="recipe.need">What you need</h3>
          <ul id="recipe-ingredients"></ul>

          <h3 data-i18n="recipe.how">How to make it</h3>
          <ol id="recipe-steps" class="steps"></ol>

          <p id="recipe-tip" class="tip" hidden></p>
        </section>
      </section>
    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
